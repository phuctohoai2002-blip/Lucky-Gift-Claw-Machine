<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#21172f">
  <title>Lucky Pixel — 20/10</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="hero">
      <div class="event-label">★ LIMITED EVENT · 20/10 ★</div>
      <h1>HAPPY <span>20/10</span></h1>
      <p class="subtitle">MÁY GẮP QUÀ MAY MẮN</p>
      <p class="description">Một món quà nhỏ dành riêng cho bạn!</p>
    </header>

    <section class="machine" aria-label="Máy gắp quà pixel art">
      <div class="machine-top">
        <span class="lights" aria-hidden="true">● ● ●</span>
        <span class="brand">LUCKY PIXEL</span>
        <span class="lights" aria-hidden="true">● ● ●</span>
      </div>

      <div class="window">
        <canvas id="game" width="320" height="360" aria-label="Máy gắp các món quà pixel"></canvas>
      </div>

      <div class="control-panel">
        <div class="status" aria-live="polite">
          <span class="status-light"></span>
          <span id="status">ĐANG TẢI QUÀ...</span>
        </div>

        <div class="buttons">
          <button id="leftBtn" class="arrow-btn" aria-label="Di chuyển càng gắp sang trái">◀</button>
          <button id="grabBtn" class="grab-btn">✦ GẮP QUÀ ✦</button>
          <button id="rightBtn" class="arrow-btn" aria-label="Di chuyển càng gắp sang phải">▶</button>
        </div>

        <p class="hint">Di chuyển càng gắp rồi nhấn GẮP QUÀ</p>
      </div>

      <div class="machine-base">
        <div class="speaker" aria-hidden="true">▮ ▮ ▮ ▮ ▮</div>
        <div class="coin-slot" aria-hidden="true"></div>
        <div class="base-label">GOOD LUCK!</div>
      </div>
    </section>

    <section id="prizePanel" class="prize-panel" hidden aria-live="polite">
      <div class="sparkles" aria-hidden="true">✦ ✧ ★ ✧ ✦</div>
      <p class="prize-kicker">BẠN GẮP ĐƯỢC MÓN QUÀ</p>
      <h2 id="prizeTitle">BẠN ĐÃ NHẬN ĐƯỢC QUÀ!</h2>
      <p id="prizeText"></p>
      <button id="againBtn" class="grab-btn">CHƠI LẠI</button>
    </section>

    <footer>MADE WITH PIXEL LOVE · 20/10</footer>
  </main>

  <script src="game.js"></script>
</body>
</html>
